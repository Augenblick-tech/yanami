[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1.81"
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3"
regex = "1.10.6"
tracing = "0.1.40"
unicode-normalization = "0.1.25"
sqlx = { version = "0.9.0", features = ["sqlite", "json", "runtime-tokio", "tls-rustls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "brotli", "json", "multipart", "cookies", "form"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.122"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
anyhow = "1.0.86"
thiserror = "1.0.69"
tokio = { version = "1.39.2", features = ["signal", "macros"] }
scraper = "0.20.0"
async-stream = "0.3.6"
dashmap = "6.2.1"
simd-normalizer = "0.1.1"
url = "2.5.2"
serde_bencode = "0.2.4"
sha1 = "0.10.6"
rss = "2"
formatx = "0.2.4"
hex = "0.4.3"
base32 = "0.5.1"
argon2 = { version = "0.5.3", features = ["std"] }
rand = "0.8.5"
librqbit = "8.1.1"
librqbit-core = "5.0.0"

[workspace.lints.clippy]
used_underscore_binding = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"