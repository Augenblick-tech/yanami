[package]
name = "feed"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.81"
base32 = "0.5.1"
domain = { path = "../domain" }
formatx = "0.2.4"
regex = "1"
serde = { version = "1.0.204", features = ["derive"] }
serde_bencode = "0.2.4"
sha1 = "0.10.6"
tracing = "0.1.40"
url = "2.5.2"
user = { path = "../user" }

[dev-dependencies]
tokio = { version = "1.39.2", features = ["macros", "rt"] }
